apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kubeflow
  namespace: argocd
spec:
  description: Kubeflow core platform + practice apps (test-cluster rehearsal for prod)

  # Apps in this project may ONLY pull from our GitOps repo.
  # (Upstream kubeflow/community-distribution is consumed as pinned kustomize
  # remote bases inside platform/*, so it never appears as an Application source.)
  sourceRepos:
    - https://github.com/kubeflow-akash/lfx26-t3-test-cluster

  # Apps in this project may ONLY deploy into these namespaces.
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd                      # child Application CRs (app-of-apps)
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: istio-system
    - server: https://kubernetes.default.svc
      namespace: auth                        # dex
    - server: https://kubernetes.default.svc
      namespace: oauth2-proxy
    - server: https://kubernetes.default.svc
      namespace: kubeflow
    - server: https://kubernetes.default.svc
      namespace: kubeflow-user-example-com
    - server: https://kubernetes.default.svc
      namespace: hello                       # phase 2 practice app

  # Cluster-scoped kinds must be explicitly whitelisted. If a sync fails with
  # "resource ... is not permitted in project kubeflow", the error names the kind:
  # review it, add it here via git, sync the project change, retry.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: cert-manager.io
      kind: ClusterIssuer
    - group: scheduling.k8s.io
      kind: PriorityClass
    - group: metacontroller.k8s.io
      kind: "*"
