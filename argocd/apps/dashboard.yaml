apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dashboard
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: kubeflow
  source:
    repoURL: https://github.com/kubeflow-akash/lfx26-t3-test-cluster
    targetRevision: main
    path: platform/dashboard
  destination:
    server: https://kubernetes.default.svc
    namespace: kubeflow
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
