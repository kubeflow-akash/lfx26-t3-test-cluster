apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello
  namespace: argocd            # Application CRs live where Argo CD runs
  annotations:
    argocd.argoproj.io/sync-wave: "0"   # independent of the Kubeflow waves
spec:
  project: kubeflow            # now governed by the restricted AppProject
  source:
    repoURL: https://github.com/kubeflow-akash/lfx26-t3-test-cluster
    targetRevision: main       # branch, tag, or commit SHA — "what git state is truth"
    path: apps/hello           # folder to render; Argo CD auto-detects kustomize
  destination:
    server: https://kubernetes.default.svc   # "this same cluster"
    namespace: hello           # where the rendered resources go
  syncPolicy:                  # NOTE: no `automated:` block => MANUAL sync
    syncOptions:
      - CreateNamespace=true   # sync may create the target namespace
